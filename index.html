760px){.shell{display:block}.sidebar{position:static;height:auto;padding:20px}.brand{padding:0 0 18px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.nav .num,.sidebar footer{display:none}.main{padding:22px 18px}.grid,.grid.three,.form-grid{grid-template-columns:1fr}.heading{align-items:start;flex-direction:column}.auth{display:block}.auth-hero{padding:32px}.auth-hero .brand{margin-bottom:12px}.auth-hero h1{font-size:40px}.auth-form{padding:30px}.card{padding:22px}.topbar{margin-bottom:24px}h1{font-size:34px}.wide{grid-column:auto}}

.demo-banner{background:#fff0dc;color:#542e00;padding:12px 18px;font-size:13px;line-height:1.6;border-bottom:1px solid #f7941e}.auth-hero .brand{margin-bottom:30px}.welcome-choice{margin-top:22px}.privacy-copy{font-size:14px;line-height:1.7}.main .notice{overflow-wrap:anywhere}audio{max-width:100%}.learning-link{display:inline-block;border-radius:8px;background:var(--brand-orange);color:var(--ink);padding:12px 18px;font-weight:600;text-decoration:none}.learning-link.secondary{background:#fff0dc}.learning-nav{display:block;padding:12px 18px;color:#d0d2d2;font-size:14px;text-decoration:none;border-radius:8px}.learning-nav:hover{background:#352617;color:white}@media(max-width:760px){.learning-nav{white-space:nowrap}}</style></head><body><div id="app"></div><div id="notice" role="status" aria-live="polite"></div><script>const app=document.querySelector('#app');let state,view='Dashboard';
const demoConfig={"version":"pilot-1","status":"illustrative-not-validated","domains":[{"id":"income","title":"Income strength","question":"How dependable is your income?","stage":"Earn","action":"Map your income sources and one way to strengthen earning capacity.","weight":1},{"id":"cashflow","title":"Cash-flow discipline","question":"How consistently do you plan and review your cash flow?","stage":"Stabilize","action":"Create a monthly cash-flow plan covering income and essential obligations.","weight":1},{"id":"resilience","title":"Financial resilience","question":"How prepared are you for an unexpected essential expense?","stage":"Stabilize","action":"Set an emergency reserve goal and a realistic contribution plan.","weight":1},{"id":"debt","title":"Debt health","question":"How manageable are your debt obligations?","stage":"Stabilize","action":"List outstanding debts, costs and due dates, then draft a repayment strategy.","weight":1},{"id":"building","title":"Wealth creation","question":"How consistently do you develop earning capacity or productive assets?","stage":"Build","action":"Choose one income-building project and define its next practical step.","weight":1},{"id":"investing","title":"Investment readiness","question":"How well can you explain investment risk, liquidity and diversification?","stage":"Invest","action":"Write your goals, time horizon and liquidity needs before evaluating investments.","weight":1},{"id":"protection","title":"Wealth protection","question":"How current is your review of financial protection needs?","stage":"Protect","action":"Review the risks that could disrupt your income and household commitments.","weight":1},{"id":"legacy","title":"Legacy readiness","question":"How prepared are you to discuss and document your wealth legacy?","stage":"Transfer","action":"Plan a family wealth conversation and record questions for a qualified professional.","weight":1}],"readinessThreshold":60,"verification":{"minimumEvidenceCharacters":30,"requiresAdminReview":true}};const demoPlans={"currency":"KES","status":"pricing-hypothesis-no-live-billing","periods":{"monthly":{"months":1,"discount":0},"quarterly":{"months":3,"discount":0.05},"annual":{"months":12,"discount":0.15}},"plans":[{"id":"free","name":"Wealth Check","monthly":0,"niaLimit":5,"features":["diagnostic","goals","learning","passport"]},{"id":"explorer","name":"Explorer","monthly":499,"niaLimit":30,"features":["diagnostic","goals","learning","passport","roadmap"]},{"id":"builder","name":"Builder","monthly":999,"niaLimit":150,"features":["diagnostic","goals","learning","passport","roadmap","journal","decision"]},{"id":"architect","name":"Wealth Architect","monthly":2499,"niaLimit":300,"features":["diagnostic","goals","learning","passport","roadmap","journal","decision"]}]};
const stages = ['Earn','Stabilize','Build','Invest','Protect','Transfer'];
function validateMethodology(config) {
  if (!config || !/^[a-zA-Z0-9._-]{1,60}$/.test(config.version) || !Array.isArray(config.domains) || config.domains.length < 1 || config.domains.length > 30) throw new Error('Invalid methodology configuration');
  const ids = new Set();
  for (const d of config.domains) {
    if (!/^[a-z]+$/.test(d.id) || ids.has(d.id) || !stages.includes(d.stage) || !Number.isFinite(d.weight) || d.weight <= 0 || ['title','question','action'].some(k=>typeof d[k] !== 'string' || !d[k].trim() || d[k].length > 1000)) throw new Error('Invalid domain');
    ids.add(d.id);
  }
  if (!Number.isFinite(config.readinessThreshold) || config.readinessThreshold < 0 || config.readinessThreshold > 100 || !Number.isInteger(config.verification?.minimumEvidenceCharacters) || config.verification.minimumEvidenceCharacters < 1 || config.verification.minimumEvidenceCharacters > 5000 || config.verification.requiresAdminReview !== true) throw new Error('Invalid progression rules');
  return config;
}
function diagnose(answers, config) {
  validateMethodology(config);
  const domains = config.domains.map(d=>{
    if (!Number.isInteger(answers[d.id]) || answers[d.id] < 0 || answers[d.id] > 4) throw new Error(`Answer required: ${d.title}`);
    return {...d, score:answers[d.id]*25};
  });
  const score = Math.round(domains.reduce((s,d)=>s+d.score*d.weight,0)/domains.reduce((s,d)=>s+d.weight,0));
  const priorities = [...domains].sort((a,b)=>stages.indexOf(a.stage)-stages.indexOf(b.stage)||a.score-b.score).filter(d=>d.score<config.readinessThreshold);
  const focus = priorities[0] || [...domains].sort((a,b)=>a.score-b.score)[0];
  return {score,version:config.version,status:config.status,domains:domains.map(({id,title,score})=>({id,title,score})),stage:focus.stage,priority:focus.action,roadmap:(priorities.length?priorities:domains).slice(0,4).map(d=>({id:d.id,stage:d.stage,title:d.title,action:d.action})),interpretation:`Your next focus is ${focus.title.toLowerCase()}. ${focus.action} This self-assessment uses pilot rules and is not a validated financial assessment.`};
}

// Provider boundary. No external service receives user data in this release.
const modes = ['Coach','Planner','Learning','Investment Intelligence','Risk','Reflection'];
function respond({mode,message,context}) {
  if (/guarantee|buy |sell |stock pick|trade for me/i.test(message)) return 'I can explain investment concepts and help you examine assumptions. I cannot execute transactions, promise returns or select investments for you. What goal, time horizon and downside are you considering?';
  const lead = context?.priority ? `Your current roadmap suggests: ${context.priority} ` : '';
  const replies = {
    Coach:'Choose one manageable money habit for this week. What tends to get in the way, and what reminder would help?',
    Planner:'Write down the target, deadline, current amount and affordable monthly contribution. Divide the remaining target by the months available and check it against your cash flow.',
    Learning:'Wealth development connects income, stability, productive assets, investing, protection and legacy. Choose a learning unit and apply one concept before moving on.',
    'Investment Intelligence':'Compare how an asset generates value, its costs, liquidity, concentration and potential losses. Verify claims with authoritative sources and consider whether you understand the risks.',
    Risk:'Consider loss of income, unexpected obligations, lack of liquidity and loss of capital. What would happen if your expected outcome did not occur?',
    Reflection:'Compare your original rationale with what happened. Separate the quality of your reasoning from the outcome, and record what you would change next time.'
  };
  return lead+replies[mode];
}

const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>new Intl.NumberFormat('en-KE',{style:'currency',currency:'KES',maximumFractionDigits:0}).format(v);
const notify=message=>{document.querySelector('#notice').textContent=message;setTimeout(()=>document.querySelector('#notice').textContent='',6000);};
const button=(label,to,secondary=false)=>to==='Learning'?`<a class="learning-link ${secondary?'secondary':''}" href="https://chatgpt.com/g/g-6849c36ba55c81919aac7c1648571ec1-nia" target="_blank" rel="noopener noreferrer" aria-label="${esc(label)} with NIA (opens in a new tab)">Discuss with NIA ↗</a>`:`<button data-view="${esc(to)}" class="${secondary?'secondary':''}">${label}</button>`;
const field=(label,name,type='text',value='',required=true)=>`<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''} ${type==='number'?'min="0" max="1000000000000" step="0.01"':''} ${type==='password'?'minlength="12" maxlength="128" autocomplete="current-password"':''}></label>`;
const area=(label,name,value='')=>`<label>${label}<textarea name="${name}" required maxlength="12000">${esc(value)}</textarea></label>`;
const empty=message=>`<p class="empty">${message}</p>`;
const heading=(title,description,action='')=>`<div class="heading"><div><div class="eyebrow">${esc(view)}</div><h1>${title}</h1><p class="muted">${description}</p></div>${action}</div>`;
const locked=feature=>!state.features.includes(feature)?`<div class="card"><h2>Continue with a fuller pathway</h2><p>Your current plan does not include this feature. Pilot access can be assigned by an administrator.</p>${button('View membership','Membership')}</div>`:'';

const pages={
 Dashboard(){const a=state.assessment;return heading(`Your next chapter, ${esc(state.user.name.split(' ')[0])}.`,'Small actions. Stronger foundations. A clearer direction.',button(a?'Reassess wealth health':'Take the diagnostic','Diagnostic'))+`<div class="stage-track">${state.stages.map((s,i)=>`<span class="${a?.stage===s?'current':''}">${i+1} &nbsp;${s}</span>`).join('')}</div><div class="grid"><section class="card dark"><div class="row"><h2>Wealth Health</h2><span class="pill">${a?esc(a.stage):'Start your journey'}</span></div><div class="score">${a?a.score:'—'}<small> / 100</small></div><p class="muted">${a?'An illustrative snapshot of your self-assessment.':'Your first assessment will reveal your starting point.'}</p>${a?`<small>Assessed ${new Date(a.createdAt).toLocaleDateString()} · ${esc(a.version)}</small>`:button('Discover your starting point →','Diagnostic')}</section><section class="card"><div class="eyebrow">Your priority action</div><h2>${a?esc(a.roadmap[0]?.title):'Begin with understanding'}</h2><p>${a?esc(a.priority):'Answer eight short questions about your current financial habits and preparedness.'}</p>${button(a?'Open my roadmap →':'Begin diagnostic →',a?'Roadmap':'Diagnostic')}</section></div><div class="grid"><section class="card"><h2>Your foundations</h2>${a?a.domains.map(d=>`<div class="row"><span>${esc(d.title)}</span><strong>${d.score}</strong></div><progress value="${d.score}" max="100" aria-label="${esc(d.title)}"></progress>`).join(''):empty('Domain scores appear after your diagnostic.')}</section><section class="card"><h2>Progress that means something</h2><div class="listitem row"><span>Actions recorded</span><strong>${state.passport.filter(p=>p.status==='Self-recorded').length}</strong></div><div class="listitem row"><span>Actions in progress</span><strong>${state.actions.length}</strong></div><div class="listitem row"><span>Learning reflections recorded</span><strong>${state.learning.length} / ${state.lessons.length}</strong></div><div class="listitem row"><span>Goals in motion</span><strong>${state.goals.length}</strong></div><div class="actions">${button('View passport','Passport',true)}${button('Set a goal','Goals',true)}</div><div class="notice">Learning is the beginning. Put a plan into practice, record your action and build your passport.</div>${button('Talk through your next step with NIA','NIA Wealth',true)}</section></div>`;},
 Diagnostic(){return heading('Understand your starting point.','Reflect honestly. This assessment helps you choose your next action.')+`<div class="notice">Pilot assessment: these self-reported scores are a starting point for discussion with NIA, not a validated financial assessment.</div><form id="diagnostic" class="card"><div class="form-grid">${state.questions.map(q=>`<label>${esc(q.title)}<p class="muted">${esc(q.question)}</p><select name="${q.id}" required><option value="">Choose your current position</option>${['Not yet in place','Just getting started','Partly established','Mostly established','Consistently established'].map((x,i)=>`<option value="${i}">${x}</option>`).join('')}</select></label>`).join('')}</div><button>Generate my wealth roadmap →</button></form>`;},
 Roadmap(){const a=state.assessment;return heading('A practical path forward.','Learn → Plan → Act → Prove → Advance')+(!a?`<div class="card">${empty('Complete your diagnostic to generate a personalized starting path.')}${button('Take diagnostic','Diagnostic')}</div>`:`<div class="notice">${esc(a.interpretation)} Reassess after taking action or when your circumstances change.</div>${!state.features.includes('roadmap')?'<p class="muted">Free roadmap preview · Your first priority action</p>':''}${a.roadmap.map((r,i)=>`<section class="card step"><div class="step-index">${i+1}</div><div><span class="pill">${esc(r.stage)}</span><h2>${esc(r.title)}</h2><p>${esc(r.action)}</p><p class="muted">Evidence: describe the action taken, what changed and what you learned. Avoid account numbers or identity documents.</p><div class="actions">${state.actions.some(x=>x.domain===r.id)?'<span class="pill">Action started</span>':`<button data-action="start" data-id="${r.id}">Start this action</button>`}${button('Learn','Learning',true)}${button('Record evidence','Passport',true)}</div></div></section>`).join('')}`);},
 Passport(){return heading('Make your progress visible.','Record the actions that strengthen your wealth-building capability.')+`<div class="grid"><div><section class="card"><h2>Your wealth passport</h2>${state.passport.length?state.passport.map(p=>`<div class="listitem"><div class="row"><strong>${esc(p.title)}</strong><span class="pill">${esc(p.status)}</span></div><small>${esc(p.stage)} · ${new Date(p.createdAt).toLocaleDateString()}</small><p>${esc(p.text)}</p>${p.reviewNote?`<p class="muted">Review: ${esc(p.reviewNote)}</p>`:''}</div>`).join(''):empty('Your first milestone begins with a real action.')}</section></div><form id="evidence" class="card"><h2>Submit evidence</h2><label>Capability area<select name="domain">${state.questions.map(q=>`<option value="${q.id}">${esc(q.title)}</option>`).join('')}</select></label>${area('What did you do, and what changed?','text')}<p class="muted">Submissions remain pending until an administrator reviews them. Text evidence only; do not include sensitive documents.</p><button>Submit for review</button></form></div>`;},
 Goals(){return heading('Give your ambition a destination.','Set a clear target and track your contributions.')+`<div class="grid"><section>${state.goals.length?state.goals.map(g=>`<div class="card"><h2>${esc(g.title)}</h2><div class="row"><strong>${money(g.saved)}</strong><span class="muted">of ${money(g.target)}</span></div><progress value="${g.saved}" max="${g.target||1}" aria-label="Goal progress"></progress><small>Target date: ${esc(g.deadline)}</small><form data-goal="${g.id}"><div class="actions">${field('Update amount saved','saved','number',g.saved)}<button>Save progress</button></div></form></div>`).join(''):empty('Add your first short-, medium- or long-term goal.')}</section><form id="goal" class="card"><h2>Create a goal</h2>${field('Goal name','title')}${field('Target amount (KES)','target','number')}${field('Already saved (KES)','saved','number',0)}${field('Target date','deadline','date')}<button>Create goal</button></form></div>`;},
 Learning(){return heading('Learn something. Put it to work.','Short learning units connected to your wealth journey.')+`<div class="grid">${state.lessons.map(l=>`<section class="card"><div class="row"><span class="pill">${esc(l.stage)}</span><small>${state.learning.some(x=>x.lesson===l.id)?'✓ Completed':'Foundational learning'}</small></div><h2>${esc(l.title)}</h2><p class="muted">${esc(l.objective)}</p><details><summary>Open learning unit</summary><p class="lesson-body">${esc(l.text)}</p>${l.audio?`<audio controls preload="none" src="${esc(l.audio)}"></audio>`:''}${l.workbook?`<p><a href="${esc(l.workbook)}" target="_blank" rel="noopener noreferrer">Open workbook</a></p>`:''}<p>${esc(l.microContent)}</p><h3>Your action</h3><p>${esc(l.action)}</p><p class="muted">Evidence: ${esc(l.evidence)}</p><p class="muted">Completion: ${esc(l.completionCriteria)}</p><form data-lesson="${l.id}">${area(esc(l.reflection),'reflection')}<button>${state.learning.some(x=>x.lesson===l.id)?'Already completed':'Record learning completion'}</button></form></details></section>`).join('')}</div>`;},
 'Decision Journal'(){return heading('Build a record of your reasoning.','Capture your assumptions today. Reflect on them later.')+(locked('journal')||`<details class="card" open><summary>Record a decision</summary><form id="journal"><div class="form-grid">${field('Decision','decision')}${field('Decision date','date','date',new Date().toISOString().slice(0,10))}${field('Amount (KES)','amount','number')}${field('Time horizon','horizon')}${area('Why are you considering this?','rationale')}${area('Expected outcome','expected')}${area('Risks considered','risks')}${area('Evidence used','evidence')}${field('Emotional state / confidence','emotion')}${field('Review date','reviewDate','date')}</div><button>Save decision</button></form></details>${state.journal.map(j=>`<section class="card"><div class="row"><h2>${esc(j.decision)}</h2><span>${money(j.amount)}</span></div><small>${esc(j.date)} · Review ${esc(j.reviewDate)} · ${esc(j.horizon)}</small><p>${esc(j.rationale)}</p><details><summary>View assumptions</summary><p>Expected: ${esc(j.expected)}</p><p>Risks: ${esc(j.risks)}</p><p>Evidence: ${esc(j.evidence)}</p><p>Emotional state: ${esc(j.emotion)}</p></details></section>`).join('')}`);},
 'NIA Wealth'(){return heading('Think through your next step.','A space to learn, plan and reflect.')+`<div class="notice">NIA is in guided demo mode: responses use local templates, not a live AI model. ${state.user.aiConsent?'Your latest roadmap may inform responses.':'Your financial context is not used; enable it in Settings if you choose.'}</div><div class="card">${state.chat.length?state.chat.slice(-20).map(c=>`<div class="message"><span class="chat-label">You · ${esc(c.mode)}</span><p>${esc(c.message)}</p></div><div class="message nia"><span class="chat-label">NIA · guided demo</span><p>${esc(c.answer)}</p></div>`).join(''):empty('Choose a mode and start with the question on your mind.')}<form id="nia"><label>Mode<select name="mode">${['Coach','Planner','Learning','Investment Intelligence','Risk','Reflection'].map(x=>`<option>${x}</option>`).join('')}</select></label>${area('What would you like to explore?','message')}<button>Send to NIA →</button></form></div>`;},
 Membership(){return heading('Choose your level of support.','Pricing hypotheses for the Kenya pilot. No live billing is connected.')+`<label>Billing period<select id="period"><option value="monthly">Monthly</option><option value="quarterly">Quarterly · 5% illustrative saving</option><option value="annual">Annual · 15% illustrative saving</option></select></label><div class="grid">${state.plans.plans.map(p=>`<section class="card ${p.id===state.user.plan?'dark':''}"><span class="pill">${p.id===state.user.plan?'Your current plan':'Pilot plan'}</span><h2>${esc(p.name)}</h2><div class="price" data-price="${p.monthly}">${money(p.monthly)}</div><p class="muted">${p.features.map(esc).join(' · ')}</p><p>${p.niaLimit} NIA interactions per calendar month</p><button data-action="subscribe" data-id="${p.id}" class="${p.id===state.user.plan?'':'secondary'}">${p.id===state.user.plan?'Current membership':'Check availability'}</button></section>`).join('')}</div>`;},
 Settings(){return heading('Your profile. Your choices.','Control your information and how NIA uses it.')+`<div class="grid"><form id="profile" class="card"><h2>Profile & consent</h2>${field('Your name','name','text',state.user.name)}<p class="muted">${esc(state.user.email)}</p><label class="check"><input type="checkbox" name="aiConsent" ${state.user.aiConsent?'checked':''}>Allow NIA to use my latest diagnostic roadmap to contextualize responses. No external AI provider is connected.</label><button>Save preferences</button></form><section class="card"><h2>Your data</h2><p>Download your profile, activity and wealth records as JSON.</p><button data-action="export" class="secondary">Export my data</button><details><summary>Delete my account</summary><p>This removes your account and associated records from this application. Existing exported files or operator backups are separate.</p><form id="delete">${field('Type your email to confirm','confirm','email')}<button class="danger">Permanently delete my account</button></form></details></section></div>`;},
};
const testerSlot=new URLSearchParams(window.location.search).get('tester');
const validTesterSlot=/^[1-5]$/.test(testerSlot||'')?testerSlot:null;
// Keep the owner's existing records untouched; pilot links use separate local keys.
const storageKey=validTesterSlot?'afrique-wealth-pilot-tester-'+validTesterSlot:'afrique-wealth-html-v1';
const lessonContent=[
 ['Earn','Map your earning capacity','List your income sources and how dependable each one is. Identify one skill, service or work opportunity you could develop. Consider the time and cost required, rather than assuming additional income is guaranteed.'],
 ['Stabilize','Create breathing room','Map your essential expenses, obligations and income. A cash-flow plan helps you understand the timing of money in and out. Review actual amounts regularly and choose a manageable step toward resilience.'],
 ['Build','Turn income into capacity','Productive assets and skills can support future income. Compare the costs, effort, maintenance and possible losses before committing. Begin with a small, clearly defined project and review what you learn.'],
 ['Invest','Understand before you invest','Consider how an asset creates value, its costs, liquidity and possible losses. Diversification reduces dependence on a single holding but does not remove risk. Record your goals and time horizon before evaluating any investment.'],
 ['Protect','Review what could disrupt your plan','Consider income interruption, unexpected obligations and asset risks. Record questions to discuss with qualified insurance, tax or legal professionals. This learning unit does not replace individual professional advice.'],
 ['Transfer','Start a legacy conversation','Clarify family values, responsibilities and important records. Make a list of questions for a family conversation and a qualified professional. Legal arrangements depend on your jurisdiction and circumstances.']
];
function newState(name){return {version:1,user:{name,role:'demo',plan:'builder',aiConsent:false},assessment:null,history:[],goals:[],journal:[],passport:[],learning:[],actions:[],chat:[]};}
function enrich(s){return {...s,questions:demoConfig.domains.map(({id,title,question})=>({id,title,question})),stages,features:['diagnostic','goals','learning','passport','roadmap','journal'],plans:demoPlans,lessons:lessonContent.map(([stage,title,text],i)=>({id:'unit-'+i,stage,title,text,objective:demoConfig.domains.find(d=>d.stage===stage)?.action||title,action:demoConfig.domains.find(d=>d.stage===stage)?.action||title,reflection:'What is one step you can put into practice?',evidence:'Describe the step you took and what you learned.',completionCriteria:'Read the unit and record your reflection.'}))};}
function persisted(s){return {version:1,user:s.user,assessment:s.assessment,history:s.history||[],goals:s.goals,journal:s.journal,passport:s.passport,learning:s.learning,actions:s.actions,chat:s.chat};}
function save(next){const data=persisted(next);try{localStorage.setItem(storageKey,JSON.stringify(data));}catch{throw new Error('Your browser could not save this change. Storage may be blocked or full. Export your existing progress before closing this page.');}state=enrich(data);}
function load(){try{const raw=localStorage.getItem(storageKey);if(!raw)return null;const s=JSON.parse(raw);if(s.version!==1||typeof s.user?.name!=='string'||!['goals','journal','passport','learning','actions','chat'].every(k=>Array.isArray(s[k])))throw new Error('Invalid saved data');return enrich(s);}catch{return null;}}
const item=data=>({id:crypto.randomUUID(),createdAt:new Date().toISOString(),...data});
const text=(v,max=5000)=>{if(typeof v!=='string'||!v.trim()||v.length>max)throw new Error('Please enter valid text.');return v.trim();};
const amount=v=>{const n=Number(v);if(!Number.isFinite(n)||n<0||n>1e12)throw new Error('Enter a valid non-negative amount.');return n;};
function welcome(){const saved=load();app.innerHTML=`<div class="auth"><section class="auth-hero"><div class="brand">AFRIQUE<span>WEALTH OS</span></div><div class="eyebrow">Your wealth journey starts here</div><h1>Turn income into<br>lasting capability.</h1><p>Understand where you are. Build a practical plan. Take action and see your progress.</p><div class="stage-track">${stages.map(s=>`<span>${s}</span>`).join('')}</div><small>Earn → Stabilize → Build → Invest → Protect → Transfer</small></section><section class="auth-form"><h2>Your next chapter starts here.</h2><p class="muted">Explore your wealth journey with this interactive demo.</p>${saved?`<div class="card"><p>Welcome back, <strong>${esc(saved.user.name)}</strong>.</p><button data-action="resume">Continue my journey →</button></div>`:`<form id="welcome">${field('What should we call you?','name')}<label class="check"><input type="checkbox" name="consent" required>I understand this demo saves progress in this browser and anyone using this browser can access it.</label><button>Begin my journey →</button></form>`}<div class="notice privacy-copy">Use sample information here. Progress stays in this browser; it is not a secure account and does not sync across devices. Clearing browser data removes it. You can export progress in Settings.</div><details><summary>Sign in with Google account</summary><p class="privacy-copy">Google sign-in is available in the separate hosted application after setup. This simple HTML demo does not have Google sign-in or shared accounts.</p></details><p><small>Educational support · Illustrative scoring · NIA opens in ChatGPT</small></p></section></div>`;}
function render(){const nav=['Dashboard','Diagnostic','Roadmap','Passport','Goals','Learning','Decision Journal','NIA Wealth','Settings'];app.innerHTML=`<div class="demo-banner">Founding tester pilot · Saved on this device · Export your progress in Settings.</div><div class="shell"><aside class="sidebar"><div class="brand">AFRIQUE<span>WEALTH OS</span></div><nav class="nav" aria-label="Main navigation">${nav.map((n,i)=>`${n==='Learning'?`<a class="learning-nav" href="https://chatgpt.com/g/g-6849c36ba55c81919aac7c1648571ec1-nia" target="_blank" rel="noopener noreferrer" aria-label="Learning with NIA (opens in a new tab)"><span class="num">${String(i+1).padStart(2,'0')}</span>Course guidance ↗</a>`:`<button data-view="${n}" class="${view===n?'active':''}" ${view===n?'aria-current="page"':''}><span class="num">${String(i+1).padStart(2,'0')}</span>${n}</button>`}`).join('')}</nav><footer>DIAGNOSE · ACT · ADVANCE<br>A foundation for lasting wealth.</footer></aside><main class="main"><header class="topbar"><span>Your wealth journey</span><div>${esc(state.user.name)} &nbsp;<button class="secondary" data-action="home">Home</button></div></header>${pages[view]()}<p class="page-footer">Afrique Wealth OS · Pilot · Educational support, not regulated financial advice.</p></main></div>`;}
pages.Passport=()=>heading('Make your progress visible.','Record your actions and what you learned.')+`<div class="notice">These are your own progress notes. They are not sent to an administrator or independently verified.</div><div class="grid"><section class="card"><h2>Your wealth passport</h2>${state.passport.length?state.passport.map(p=>`<div class="listitem"><div class="row"><strong>${esc(p.title)}</strong><span class="pill">Self-recorded</span></div><small>${esc(p.stage)} · ${new Date(p.createdAt).toLocaleDateString()}</small><p>${esc(p.text)}</p></div>`).join(''):empty('Take an action, then record your first milestone.')}</section><form id="evidence" class="card"><h2>Record an action</h2><label>Capability area<select name="domain">${state.questions.map(q=>`<option value="${q.id}">${esc(q.title)}</option>`).join('')}</select></label>${area('What did you do, and what changed?','text')}<button>Save my progress note</button></form></div>`;
pages.Settings=()=>heading('Your profile. Your choices.','Manage the progress saved in this browser.')+`<div class="grid"><form id="profile" class="card"><h2>Profile & preferences</h2>${field('Your name','name','text',state.user.name)}<p class="muted">NIA opens separately in ChatGPT. Your records are not shared automatically; you choose what to paste into your conversation.</p><button>Save preferences</button></form><section class="card"><h2>Keep a copy of your progress</h2><p>Download your notes, goals and learning progress as a readable text file or a JSON data file.</p><div class="actions"><button data-action="export-text" class="secondary">Download progress summary</button><button data-action="export" class="secondary">Export data</button></div><details><summary>Clear this browser’s pilot progress</summary><p>This removes this pilot’s saved progress from the current browser. Export a copy first if you want to keep it.</p><form id="delete">${field('Type DELETE to confirm','confirm')}<button class="danger">Clear my pilot progress</button></form></details></section></div>`;
function download(content,type,filename){const url=URL.createObjectURL(new Blob([content],{type}));const link=document.createElement('a');link.href=url;link.download=filename;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function summary(){return ['AFRIQUE WEALTH OS — PROGRESS SUMMARY',`Name: ${state.user.name}`,`Exported: ${new Date().toLocaleString()}`,'Pilot — self-reported progress','',state.assessment?`Illustrative score: ${state.assessment.score}/100\nCurrent focus: ${state.assessment.stage}\nNext action: ${state.assessment.priority}`:'Diagnostic not completed.','','GOALS',...state.goals.map(g=>`${g.title}: ${money(g.saved)} / ${money(g.target)} by ${g.deadline}`),'','PROGRESS NOTES',...state.passport.map(p=>`${p.title}: ${p.text}`),'','DECISION JOURNAL',...state.journal.map(j=>`${j.date} — ${j.decision}\nRationale: ${j.rationale}\nExpected: ${j.expected}\nRisks: ${j.risks}\nReview date: ${j.reviewDate}`),'','LEARNING',...state.learning.map(l=>`${state.lessons.find(x=>x.id===l.lesson)?.title||l.lesson}: ${l.reflection}`)].join('\n');}
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;try{if(b.dataset.view){view=b.dataset.view;render();window.scrollTo(0,0);}const action=b.dataset.action;if(action==='home')welcome();if(action==='resume'){state=load();if(!state)throw new Error('No saved progress found.');render();}if(action==='start'){const next=structuredClone(state);if(!next.actions.some(a=>a.domain===b.dataset.id))next.actions.push(item({domain:b.dataset.id,status:'Building'}));save(next);render();notify('Action started.');}if(action==='export')download(JSON.stringify(persisted(state),null,2),'application/json','afrique-wealth-progress.json');if(action==='export-text')download(summary(),'text/plain','afrique-wealth-progress.txt');}catch(error){notify(error.message);}});
app.addEventListener('submit',e=>{e.preventDefault();const f=e.target,data=Object.fromEntries(new FormData(f));try{
 if(f.id==='welcome'){if(data.consent!=='on')throw new Error('Please acknowledge browser storage.');save(newState(text(data.name,100)));view='Dashboard';render();return;}
 if(f.id==='delete'){if(data.confirm!=='DELETE')throw new Error('Type DELETE to confirm.');localStorage.removeItem(storageKey);state=null;welcome();notify('Pilot progress cleared.');return;}
 const next=structuredClone(state);
 if(f.id==='diagnostic'){const answers=Object.fromEntries(Object.entries(data).map(([k,v])=>[k,Number(v)]));const result=item(diagnose(answers,demoConfig));next.assessment=result;next.history.push(result);view='Roadmap';}
 if(f.id==='goal'){const target=amount(data.target),saved=amount(data.saved);if(target<=0||saved>target)throw new Error('Target must be greater than zero and at least the saved amount.');next.goals.unshift(item({title:text(data.title,150),target,saved,deadline:data.deadline,currency:'KES'}));}
 if(f.dataset.goal){const goal=next.goals.find(g=>g.id===f.dataset.goal);if(!goal)throw new Error('Goal not found.');const saved=amount(data.saved);if(saved>goal.target)throw new Error('Saved amount cannot exceed the target.');goal.saved=saved;}
 if(f.id==='evidence'){const domain=demoConfig.domains.find(d=>d.id===data.domain);const note=text(data.text);if(note.length<30)throw new Error('Please describe your action in at least 30 characters.');next.passport.unshift(item({domain:domain.id,title:domain.title,stage:domain.stage,text:note,status:'Self-recorded'}));next.actions=next.actions.filter(a=>a.domain!==domain.id);}
 if(f.dataset.lesson){if(!next.learning.some(l=>l.lesson===f.dataset.lesson))next.learning.push(item({lesson:f.dataset.lesson,reflection:text(data.reflection)}));}
 if(f.id==='journal'){next.journal.unshift(item({...data,decision:text(data.decision,150),amount:amount(data.amount)}));}
 if(f.id==='profile'){next.user.name=text(data.name,100);next.user.aiConsent=data.aiConsent==='on';}
 if(f.id==='nia'){const message=text(data.message,2000);if(!modes.includes(data.mode))throw new Error('Select a valid mode.');next.chat.push(item({message,mode:data.mode,answer:respond({mode:data.mode,message,context:next.user.aiConsent?next.assessment:null})}));}
 save(next);render();notify('Saved in this browser.');
 }catch(error){notify(error.message);}});
const niaUrl='https://chatgpt.com/g/g-6849c36ba55c81919aac7c1648571ec1-nia';
function niaBrief(){const a=state.assessment;return ['I am using Afrique Wealth OS. Please help me understand my needs through follow-up questions, then suggest the most relevant AYTE course from your available course information. If you do not have the current course catalogue, ask me for it rather than inventing course names or links.','',a?`My illustrative self-assessment score is ${a.score}/100. This is an unvalidated pilot score, not a verified assessment.\nCurrent focus: ${a.stage}\nSuggested priority: ${a.priority}\nDomain scores:\n${a.domains.map(d=>d.title+': '+d.score+'/100').join('\n')}`:'I have not completed the diagnostic yet. Please help me identify a starting point.','','Please ask about my goals and circumstances before recommending a learning pathway, and help me choose one practical next action. Keep the discussion educational.'].join('\n');}
pages['NIA Wealth']=()=>heading('Find your next step with NIA.','Discuss your needs, explore your results and ask for a relevant AYTE course.')+`<section class="card"><h2>Continue your conversation in ChatGPT</h2><p>1. Review the suggested message below and edit anything you do not want to share.</p><label>Message to take to NIA<textarea id="nia-brief" rows="12">${esc(niaBrief())}</textarea></label><div class="actions"><button data-action="copy-nia" class="secondary">Copy my message</button><a class="learning-link" href="${niaUrl}" target="_blank" rel="noopener noreferrer">Open NIA in ChatGPT ↗</a></div><p>2. Open NIA, paste your message and ask it to help you choose a learning pathway.</p><p>3. Return here to record your goal or next action.</p><div class="notice">Your results are not sent automatically. Only share information you are comfortable placing in ChatGPT. You may be asked to sign in. NIA conversations and course completion do not sync back to Wealth OS.</div></section>`;
const roadmapWithoutNia=pages.Roadmap;
pages.Roadmap=()=>roadmapWithoutNia()+`<section class="card"><h2>Explore your results with NIA</h2><p>Take a short summary of your diagnostic into NIA and ask for follow-up guidance and a suitable AYTE course.</p>${button('Prepare my message for NIA','NIA Wealth')}</section>`;
app.addEventListener('click',async e=>{if(e.target.closest('button')?.dataset.action!=='copy-nia')return;const field=document.querySelector('#nia-brief');try{await navigator.clipboard.writeText(field.value);notify('Message copied. Open NIA and paste it into the conversation.');}catch{field.focus();field.select();notify('Select and copy the message, then paste it into NIA.');}});
function pilotLinks(){const url=new URL(window.location.href);url.hash='';return [1,2,3,4,5].map(n=>{url.search='';url.searchParams.set('tester',n);return {number:n,url:url.href};});}
function pilotWelcome(){const saved=load();app.innerHTML=`<div class="auth"><section class="auth-hero"><div class="brand">AFRIQUE<span>WEALTH OS</span></div><div class="eyebrow">Founding tester pilot</div><h1>Build your next<br>wealth chapter.</h1><p>Understand your starting point. Choose a practical action. Continue your learning with NIA.</p><div class="stage-track">${stages.map(s=>`<span>${s}</span>`).join('')}</div></section><section class="auth-form"><h2>${validTesterSlot?'Welcome, tester '+validTesterSlot+'.':'Welcome to Afrique Wealth OS.'}</h2><p class="muted">A working pilot for a small group of testers.</p><section class="google-signin" aria-label="Google account sign-in"><button type="button" class="google-button" disabled aria-describedby="google-signin-status">Sign in with Google account</button><p id="google-signin-status" class="muted">Google sign-in is awaiting activation. You can use the browser pilot below while your account connection is being set up.</p></section>${saved?`<section class="card"><h3>Progress is saved in this browser</h3><p>Continue only if this is your own profile. This is not a password-protected account.</p><button data-action="resume">Continue my journey →</button><p><small>Using a shared device? Open your own tester link in a separate browser profile.</small></p></section>`:`<form id="welcome">${field('Your first name or nickname','name')}<label class="check"><input type="checkbox" name="consent" required>I understand my progress is saved in this browser, is not password-protected, and can be accessed by someone using this browser profile.</label><button>Start my wealth journey →</button></form>`}<div class="notice privacy-copy">Your answers stay on this device. Other testers using their own devices do not receive them. Use approximate amounts; do not enter account numbers, passwords or identity documents. Export your progress before clearing browser data.</div><p><small>Pilot assessment · Educational guidance · NIA opens in ChatGPT</small></p></section></div>`;}
welcome=pilotWelcome;
const settingsBeforePilot=pages.Settings;
pages.Settings=()=>settingsBeforePilot()+(!validTesterSlot?`<section class="card"><h2>Invite five testers</h2><p>Send one link to each tester. Each starts with an empty profile on their own browser. These links contain no financial records.</p><p class="muted">These are tester labels, not private invitations. Anyone with the website address can open the pilot. Progress does not sync across devices and is not visible to the organiser.</p>${window.location.protocol==='file:'?'<p class="notice">Upload index.html to GitHub first, then open Settings on the published website to get shareable links.</p>':pilotLinks().map(t=>`<label>Tester ${t.number}<input readonly value="${esc(t.url)}" aria-label="Link for tester ${t.number}"></label>`).join('')}</section>`:'');
state=null;welcome();
